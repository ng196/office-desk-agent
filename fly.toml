# NOT USED: Fly.io hosting was dropped ($0 budget). Kept for reference only; the engine runs locally (see CORE.md).
# Fly.io demo deploy: one machine, one volume at /data (index, cases, audit log, model cache).
# Secrets (never in this file): fly secrets set GROQ_API_KEY=... DESK_DEMO_PASSCODE=...
app = "office-desk-agent-ng"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  DESK_MODE = "demo"
  DESK_LLM_PROVIDER = "groq"
  GROQ_BASE_URL = "https://api.groq.com/openai/v1"
  DESK_LLM_MODEL = "qwen/qwen3.8-27b"
  DESK_DATA_DIR = "/data"
  HF_HOME = "/data/cache"
  DESK_CACHE = "/data/cache"

[[mounts]]
  source = "desk_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"